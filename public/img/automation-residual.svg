<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" role="img" aria-label="Two panels comparing the human task band before and after automation. Before automation the human covers the full range from routine to novel work. After automation, an automation block fills the routine end, the human is reduced to a sliver at the novel end, and a dashed monitoring line runs back across the automated region." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="720" height="450" rx="8" fill="#14161a"/>

  <text x="40" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Before automation</text>

  <rect x="40" y="62" width="640" height="58" rx="4" fill="#7a4f18" stroke="#d9a441" stroke-width="1.5"/>
  <text x="360" y="97" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Human performs the full range</text>

  <line x1="40" y1="138" x2="680" y2="138" stroke="#555555" stroke-width="1"/>
  <text x="40" y="157" fill="#cccccc" font-family="system-ui, sans-serif" font-size="11">Routine</text>
  <text x="680" y="157" fill="#cccccc" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Novel</text>

  <line x1="40" y1="190" x2="680" y2="190" stroke="#2a2d33" stroke-width="1"/>

  <text x="40" y="228" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">After automation</text>

  <defs>
    <marker id="arrowMonitor" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <text x="680" y="256" fill="#aaaaaa" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Monitoring</text>
  <path d="M612,284 L612,270 L60,270" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowMonitor)"/>

  <rect x="40" y="284" width="520" height="58" rx="4" fill="#2f4257" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="300" y="319" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Automation</text>

  <rect x="566" y="284" width="114" height="58" rx="4" fill="#7a4f18" stroke="#d9a441" stroke-width="1.5"/>
  <text x="623" y="319" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Human</text>

  <line x1="40" y1="360" x2="680" y2="360" stroke="#555555" stroke-width="1"/>
  <text x="40" y="379" fill="#cccccc" font-family="system-ui, sans-serif" font-size="11">Routine</text>
  <text x="680" y="379" fill="#cccccc" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Novel</text>

  <text x="40" y="412" fill="#dddddd" font-family="system-ui, sans-serif" font-size="12">The remaining job sits at the hard end of the range.</text>
  <text x="40" y="434" fill="#aaaaaa" font-family="system-ui, sans-serif" font-size="11">Exposure to the routine end, where the underlying skill was built, has gone to zero.</text>
</svg>
